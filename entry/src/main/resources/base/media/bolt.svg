<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 横杠是平行四边形：上边 y=3.2 从 x=4.3 到 20.8，下边 y=5.8 从 3.2 到 19.7。
       左右两边互相平行、向下左倾斜 1.1 单位 / 2.6 单位高（≈23°），
       与闪电左上肩线（12.5,5.5 → 9.2,13.2，同样 0.42 的斜率）同角，
       所以整枚标记里所有斜线是同一个方向、同一套节奏。
       包围盒与原来的圆角矩形完全一致（3.2…20.8 × 3.2…5.8），形心仍在 x=12，
       换形状不改变字重与视觉重心。 -->
  <path fill="#000" d="M4.3 3.2 H20.8 L19.7 5.8 H3.2 Z"/>
  <path fill="#000" d="M12.5 5.5 L9.2 13.2 L12 13.2 L9.8 20.5 L15.8 11.8 L12.6 11.8 L14.2 5.5 Z"/>
</svg>
