<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HarmonyGo Python</title>
  <style>
    body { font: 13px ui-monospace, Menlo, monospace; padding: 12px; color: #333; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <pre id="log">HarmonyGo Python runner</pre>
  <script>
    // Python runs in `pyodide-worker.js`, not on this page's main thread. The
    // page only relays messages and owns the timeout, so a runaway Python loop
    // can be terminated without freezing the WebView, timers or the bridge.
    var worker = null;
    var current = null;
    var pythonVersion = '';

    function log(line) {
      try {
        var node = document.getElementById('log');
        if (node) node.textContent += '\n' + line;
      } catch (_) {}
      try { if (window.dshHost) window.dshHost.log(String(line)); } catch (_) {}
    }

    function finish(id, payload) {
      if (current !== null && current.id === id) {
        clearTimeout(current.timer);
        current = null;
      }
      try { window.dshHost.postResult(String(id), JSON.stringify(payload)); } catch (_) {}
    }

    function createWorker() {
      var next = new Worker('pyodide-worker.js');
      next.onmessage = function (event) {
        var data = event.data || {};
        if (data.type === 'ready') {
          pythonVersion = String(data.version || '');
          log('pyodide: ready ' + pythonVersion);
          try { window.dshHost.pythonReady(pythonVersion); } catch (_) {}
          return;
        }
        if (data.type === 'fatal') {
          log('pyodide: failed ' + data.error);
          try { window.dshHost.pythonError(String(data.error)); } catch (_) {}
          return;
        }
        if (data.type === 'result') {
          finish(String(data.id), {
            ok: data.ok === true,
            stdout: data.stdout || '',
            stderr: data.stderr || '',
            value: data.value || '',
            error: data.error || ''
          });
        }
      };
      next.onerror = function (event) {
        log('worker error: ' + (event && event.message ? event.message : 'unknown'));
        try { window.dshHost.pythonError('Python worker crashed: ' + (event && event.message ? event.message : 'unknown')); } catch (_) {}
        if (current !== null) {
          finish(current.id, { ok: false, stdout: '', stderr: '', error: 'Python worker crashed' });
        }
        try { next.terminate(); } catch (_) {}
        if (worker === next) { worker = null; }
      };
      return next;
    }

    function ensureWorker() {
      if (worker === null) worker = createWorker();
      return worker;
    }

    window.dshRun = function (id, code, timeoutMs, files, packages) {
      id = String(id);
      if (current !== null) {
        finish(id, {
          ok: false, stdout: '', stderr: '',
          error: 'another Python run is already in progress'
        });
        return;
      }
      var budget = Number(timeoutMs);
      if (!isFinite(budget) || budget <= 0) budget = 90000;
      var target = ensureWorker();
      current = {
        id: id,
        timer: setTimeout(function () {
          log('timeout: ' + id);
          try { target.terminate(); } catch (_) {}
          if (worker === target) worker = null;
          try { window.dshHost.pythonError('Python run timed out; interpreter restarted'); } catch (_) {}
          finish(id, {
            ok: false, stdout: '', stderr: '',
            error: 'Python 运行超时，解释器已重启；请缩短代码或重试。'
          });
        }, budget)
      };
      target.postMessage({
        type: 'run',
        id: id,
        code: String(code),
        files: Array.isArray(files) ? files : [],
        packages: Array.isArray(packages) ? packages : ['pandas']
      });
    };

    window.dshEnsure = function () {
      ensureWorker().postMessage({ type: 'ensure' });
      return true;
    };

    window.dshPing = function () {
      return 'pong';
    };

    // Bridge readiness is not Python readiness: the page can accept work while
    // the worker and Pyodide are still starting.
    (function () {
      try { if (window.dshHost) window.dshHost.ready(); } catch (_) {}
      log('bridge: ready');
    })();
  </script>
</body>
</html>
