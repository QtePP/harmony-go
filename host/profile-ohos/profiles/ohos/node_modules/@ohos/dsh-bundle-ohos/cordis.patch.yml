# @ohos/dsh-bundle-ohos — HarmonyOS platform adapter rows.
#
# Applied after dsh-base + dsh-acp-app in the `ohos` profile:
#   1. one top-level insert adding the pure-JS search suite (the stock
#      tool-fs-search spawns @vscode/ripgrep through the subprocess seam, which
#      can never run on HarmonyOS — fork/exec is forbidden);
#   2. one id-targeted disable switching the stock row off, so `glob`/`grep`
#      resolve to the pure-JS implementation instead;
#   3. the same treatment for PTC: the stock ptc-runtime row loads
#      @deepseek-ai/dsh-ptc-runtime-node, whose child-process substrate can
#      never run here, so it is disabled and replaced by the in-process
#      worker+vm runtime; the tools row stays `mode: native` — every tool
#      (web_search, read/write, the pure-JS search suite, …) stays directly
#      callable exactly like the reference agents, and `run_code` remains a
#      direct tool alongside them, backed by the worker+vm runtime. (An earlier
#      revision forced `mode: ptc` here; that collapsed every tool behind
#      run_code, so the model saw no web/fs tools to call and answered "I
#      cannot search the web" — see docs/GAP-ANALYSIS.md §L2.)
#   4. the credentials-live plugin: dsh freezes the launch environment at
#      boot, so a key saved in Settings mid-session can never reach the
#      running runtime through env. The plugin polls the staged
#      `<dsh-home>/.api-key` file and pushes changes through the credentials
#      service's live set()/unset(), making saved keys effective without a
#      restart.
#
# Each plugin package must ALSO be declared in this bundle's `dependencies`:
# the profile-scope route table is built from the bundle dependency closure,
# so an undeclared package never mounts (verified — see docs/GAP-ANALYSIS.md §7).
- insert:
    - id: tool-fs-search-ohos
      name: "@ohos/dsh-tool-fs-search-js"
    - id: ptc-runtime-vm
      name: "@ohos/dsh-ptc-runtime-vm"
    - id: credentials-live-ohos
      name: "@ohos/dsh-credentials-live"
    # The ACP application bundle carries no clock context, so the model cannot
    # tell what "today" is: every relative date it reasons about (file
    # timestamps, "this week", scheduling) is a guess. dsh-sdk-app mounts this
    # row; the ohos profile has to state it itself. It injects a durable time
    # reading into request history (default: at most once per 10 minutes).
    - id: time-context
      name: "@deepseek-ai/dsh-time-context"
    # Writes the registered tool list and web readiness into bridge.log after
    # boot — the only way to answer "why can't it search the web" on a phone.
    - id: boot-report-ohos
      name: "@ohos/dsh-boot-report"
    # Reading a repository on-device: no git binary exists here, so this tool
    # clones over HTTPS with isomorphic-git (pure JS) into repos/<slug>, and the
    # existing glob/grep/read suite does the analysis. Pack size is capped
    # because js-git holds the packfile in memory.
    - id: tool-git
      name: "@ohos/dsh-tool-git"
    # Legacy cross-session memory. Superseded by @ohos/dsh-ontology: the old
    # tool wrote a free-text managed block into $DSH_HOME/AGENTS.md, which gave
    # a second, invisible source of truth beside the SQLite ontology. It is
    # kept in the payload/tests for the one-time migration path
    # (`ontology action=migrate_profile`), but no longer mounted.
    - id: tool-user-profile
      name: "@ohos/dsh-tool-user-profile"
      disabled: true
    # Word/Excel on the device: dsh's own office stack needs Python + a shell
    # (skill-office) and LibreOffice native/WASM (office-kit), none of which
    # exist here. This tool writes OOXML directly with pure JS + Node zlib.
    - id: tool-office-ohos
      name: "@ohos/dsh-tool-office"
    # Artifact pages are built from a component kit rather than written from
    # scratch: composing a page should be choosing components and filling text,
    # not re-deriving typography, dark mode and mobile width every time (and
    # not pasting a CDN link that cannot load on a phone).
    - id: tool-html
      name: "@ohos/dsh-tool-html"
- id: tool-fs-search
  disabled: true
- id: ptc-runtime
  disabled: true
# dsh 0.2.2 removed `tools.mode` outright (the schema is now `z.never()` with
# "Mount a native or PTC tool executor instead"). The native executor is the
# base default, so the old `mode: native` row is not replaced with anything —
# setting it at all is now a validation error that stops the whole boot.
# Override the DeepSeek model catalog to drop `toolUpdate: addition-only` from
# the Flash entry.
#
# Upstream's `deepseek-flash` catalog row sets toolUpdate: "addition-only". With
# that route the projection marks EVERY tool that arrives through a history
# addition as `deferLoading: true` (dsh-llm/lib/index.js toolDeclarations), so a
# fresh session sends 21 tools all flagged deferred and the API rejects the
# request outright:
#   "tools: at least one tool must have defer_loading=false"
# Removing the field falls back to the default path, which strips deferLoading
# from every tool before the request goes out.
#
# `models` is a full replacement, not a merge, so the Flash entry is restated
# with its multimodal capability intact — image input is the whole reason this
# model matters here and must survive the override.
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        inputModalities:
          - text
          - image
        # Restated so the override does not silently fall back to the 1e6
        # default: the catalog value is 1048576 and the picker shows it.
        contextWindow: 1048576
        systemPromptUpdate: in-history
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or quality-critical tasks at higher cost.
        contextWindow: 1048576


# Context ledger: writes one compact JSONL line per assistant settlement into
# `$DSH_HOME/context-ledger.jsonl` (system/tools/messages composition, context
# pressure, input/output/cacheRead/cacheWrite). ACP forwards only used/size, so
# without this the native panel cannot show where the window went or whether
# the prefix cache is actually being hit. No tool schema, no prompt section:
# it is invisible to the model.
- insert:
    - id: context-ledger-ohos
      name: "@ohos/dsh-context-ledger"
    # The user's durable ontology: SQLite entities + facts with provenance,
    # supersession, and a controlled predicate vocabulary. Pinned facts
    # (identity, language, allergies, diet, communication style) are injected
    # into every session via agent/pre-step; everything else is queried with
    # the `ontology` tool. The app panel reads snapshot.json and drops one
    # command file per delete. See docs/ONTOLOGY.md.
    - id: ontology
      name: "@ohos/dsh-ontology"
